[project]
name = "steam-req-pipeline"
version = "0.1.0"
description = "Pipeline reproduzivel de coleta de requisitos de hardware de jogos da Steam (TCC MBA DSA)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
analysis = ["pandas>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
